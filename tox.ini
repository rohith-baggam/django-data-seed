[tox]
envlist =
    py310-dj{40,42}
    py311-dj42
    py312-dj{50,51}
    py313-dj{52,60}
    lint
skip_missing_interpreters = true

[testenv]
description = Run the test suite
deps =
    dj40: Django>=4.0,<4.1
    dj42: Django>=4.2,<4.3
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    mimesis>=11
    pytest
    pytest-django
    Pillow
commands = pytest -q {posargs}

[testenv:lint]
description = Lint with ruff and type-check with mypy
skip_install = true
deps =
    ruff
    mypy
commands =
    ruff check src tests
    mypy src/django_data_seed
