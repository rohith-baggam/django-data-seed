name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff mypy
      - name: Ruff
        run: ruff check src tests
      - name: mypy
        run: mypy src/django_data_seed || true  # ? advisory until fully typed

  test-sqlite:
    name: py${{ matrix.python }} / Django ${{ matrix.django }} / sqlite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ? Cover the Django floor (4.0) up through the latest, pairing each
          # ? release with a Python it actually supports.
          - { python: "3.10", django: "4.0" }
          - { python: "3.10", django: "4.2" }
          - { python: "3.11", django: "4.2" }
          - { python: "3.12", django: "5.0" }
          - { python: "3.12", django: "5.1" }
          - { python: "3.13", django: "5.2" }
          # ? Pin the Mimesis floor once to honour the >=11 support claim.
          - { python: "3.11", django: "4.2", mimesis: "==11.*" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      # ? matrix.mimesis is a full specifier ('==11.*'); default to '>=11' when
      # ? unset. Concatenated onto 'mimesis' so it renders as a valid requirement
      # ? ('mimesis>=11' / 'mimesis==11.*'), never the invalid 'mimesis==>=11'.
      - run: pip install "Django==${{ matrix.django }}.*" "mimesis${{ matrix.mimesis || '>=11' }}" pytest pytest-django Pillow
      - run: pip install -e .
      - run: pytest -q

  test-postgres:
    name: py3.12 / Django 5.2 / postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_data_seed
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DDS_DB_ENGINE: django.db.backends.postgresql
      DDS_DB_HOST: 127.0.0.1
      DDS_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres]" pytest pytest-django Pillow "Django==5.2.*"
      - run: pytest -q

  test-mysql:
    name: py3.12 / Django 5.2 / mysql
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: django_data_seed
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DDS_DB_ENGINE: django.db.backends.mysql
      DDS_DB_HOST: 127.0.0.1
      DDS_DB_PORT: "3306"
      DDS_DB_USER: root
      DDS_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ? mysqlclient builds against the MySQL client C library, which isn't on
      # ? the runner by default.
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - run: pip install -e ".[mysql]" pytest pytest-django Pillow "Django==5.2.*"
      - run: pytest -q

  wheel-smoke:
    name: build + install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the built wheel and import it
        run: |
          pip install dist/*.whl
          python -c "import django_data_seed; print('version', django_data_seed.__version__)"
